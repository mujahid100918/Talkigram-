      </div>
    </div>
  );
}

create extension if not exists "pgcrypto";

create table public.blue_verified (
  id uuid primary key default gen_random_uuid(),
  user_id uuid references auth.users(id) on delete cascade not null,
  full_name text not null,
  nid_number text not null,
  selfie_url text,
  status text default 'pending' check (status in ('pending','approved','rejected','verified')),
  payment_status text default 'unpaid',
  verified_at timestamptz,
  created_at timestamptz default now(),
  unique(user_id)
);

alter table public.blue_verified enable row level security;

create policy "Users can view own verification"
  on public.blue_verified for select
  using (auth.uid() = user_id);
